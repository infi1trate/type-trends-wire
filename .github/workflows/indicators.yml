name: leading-indicators
# Once a day: npm weekly downloads and GitHub stars, forks and open issues for the UI libraries in crawler/seeds/indicators.json,
# posted to slug as dated points. Public numbers only. About 80 small requests.
on:
  schedule:
    - cron: "37 5 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "1 = print, don't post"
        default: "0"
concurrency: { group: leading-indicators, cancel-in-progress: false }
permissions:
  contents: read
defaults:
  run:
    working-directory: crawler
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Collect indicators
        env:
          CRAWL_ENDPOINT: https://slug.global/api/public/ingest-crawl
          CRAWL_SECRET: ${{ secrets.CRAWL_SECRET }}
          GITHUB_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry_run || '0' }}
        run: npm run indicators
