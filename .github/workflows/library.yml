name: library-crawl
on:
  schedule:
    - cron: "41 * * * *"   # hourly check slice: 1/24 of the library, only pages whose server HTML changed
    - cron: "17 7 * * *"   # daily vanguard: a full look at the brands the site lists as leading (about 45)
    - cron: "11 4 * * 6"   # Saturdays: full library snapshot (discovery, all pages, mobile)
  workflow_dispatch:
    inputs:
      mode:
        description: "full, check, or tag (one-off AI tagging backfill)"
        default: "full"
      limit:
        description: "Only the first N sites (0 = all 300)"
        default: "0"
      dry_run:
        description: "1 = don't post, upload results as an artifact"
        default: "0"
      slice:
        description: "Only slice i of n, e.g. 3/24 (empty = every site)"
        default: ""
      vanguard:
        description: "1 = full mode on the vanguard list only"
        default: "0"
      library_file:
        description: "seed list to read instead of seeds/library.csv (path under crawler/), e.g. seeds/candidates/wave-01.csv; use with dry_run=1 to check candidates"
        default: ""
      force_home:
        description: "1 = store every home snapshot even if unchanged (fills a newly added reading, e.g. structure)"
        default: "0"
# Hourly slices queue among themselves; the long full runs queue among themselves. A slice may overlap a full run: it only
# refetches server HTML for about a dozen sites.
concurrency: { group: "library-${{ github.event.schedule == '41 * * * *' && 'slice' || 'full' }}", cancel-in-progress: false }
defaults:
  run:
    working-directory: crawler
jobs:
  library:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: crawler/package-lock.json }
      - run: npm ci
      - uses: actions/cache@v4
        with: { path: ~/.cache/ms-playwright, key: "playwright-${{ runner.os }}-${{ hashFiles('crawler/package-lock.json') }}" }
      - run: npx playwright install --with-deps chromium
      # The hourly slices skip the test suite; the daily and weekly runs keep it.
      - if: github.event.schedule != '41 * * * *'
        run: npm test
      - name: Pick the slice for this hour
        if: github.event.schedule == '41 * * * *'
        run: echo "SLICE=$(date -u +%-H)/24" >> "$GITHUB_ENV"
      - name: Library crawl
        env:
          CRAWL_ENDPOINT: https://slug.global/api/public/ingest-crawl
          CRAWL_SECRET: ${{ secrets.CRAWL_SECRET }}
          LIBRARY_MODE: ${{ inputs.mode || (github.event.schedule == '41 * * * *' && 'check' || 'full') }}
          VANGUARD: ${{ inputs.vanguard || (github.event.schedule == '17 7 * * *' && '1' || '0') }}
          LIMIT: ${{ inputs.limit || '0' }}
          DRY_RUN: ${{ inputs.dry_run || '0' }}
          LIBRARY_FORCE_HOME: ${{ inputs.force_home || '0' }}
          LIBRARY_FILE: ${{ inputs.library_file || '' }}
          CONCURRENCY: "8"
          SLICE_INPUT: ${{ inputs.slice }}
        run: |
          if [ -n "$SLICE_INPUT" ]; then export SLICE="$SLICE_INPUT"; fi
          npm run library
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: library-out, path: crawler/out/, if-no-files-found: ignore, retention-days: 14 }
