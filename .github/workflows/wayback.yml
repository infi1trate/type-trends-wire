name: wayback-backfill
on:
  schedule:
    - cron: "17 */6 * * *"   # resumable: each run picks up the quarters still missing; idles once complete
  workflow_dispatch:
    inputs:
      limit:
        description: "Only the first N library sites (0 = all)"
        default: "0"
      pass_max:
        description: "1 = Q1s only, 2 = +Q3s, 3 = every quarter"
        default: "3"
      budget_min:
        description: "Stop starting new captures after N minutes"
        default: "320"
      dry_run:
        description: "1 = don't post, upload results as an artifact"
        default: "0"
concurrency: { group: wayback, cancel-in-progress: false }
defaults:
  run:
    working-directory: crawler
jobs:
  wayback:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: crawler/package-lock.json }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - name: Wayback backfill
        env:
          CRAWL_ENDPOINT: https://type-trends-wire.lovable.app/api/public/ingest-crawl
          CRAWL_SECRET: ${{ secrets.CRAWL_SECRET }}
          LIMIT: ${{ inputs.limit || '0' }}
          PASS_MAX: ${{ inputs.pass_max || '3' }}
          TIME_BUDGET_MIN: ${{ inputs.budget_min || '320' }}
          DRY_RUN: ${{ inputs.dry_run || '0' }}
          WB_CONCURRENCY: "3"
        run: npm run wayback
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: wayback-out, path: crawler/out/, if-no-files-found: ignore, retention-days: 14 }
